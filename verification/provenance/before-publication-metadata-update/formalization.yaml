    "divergences": "The three principal manuscript results M01, M02 and M03, with their original domains and quantifier order. M01: one finite C>0 before every n>0 and compact convex Euclidean body K with nonempty interior; there exists a literal real special-linear matrix S with finite actual H0 Rayleigh infimum on interior(S K) and lambda_1(interior(S K))*volume(K)^(2/n)<=C*n. M02: one finite C>0 before every n>0 and origin-symmetric compact convex volume-one K with nonempty interior in maximal Gaussian measure position; its actual H0 Rayleigh infimum is at most C*n. M03: for each real P>=2 one finite C(P)>0 precedes every n>0, every even isotropic probability law nu satisfying the conventional compact-set IsLogConcaveMeasure condition, least Poincare constant at most P and finite actual Gaussian-relative Fisher information, and every origin-symmetric compact convex body D with nonempty interior supporting nu almost everywhere; lambda_1(interior D)<=C(P)*(n+sqrt(n*I(nu|gamma))). The log-concave density is derived from the law's original finite-information hypothesis; no density witness, covariance lower bound, ellipsoid-existence conclusion or desired spectral estimate is an additional premise. See docs/correspondence.md for exact source-to-Lean clauses and docs/proof-departures.md for material argument changes. The manuscript strategy through information decay, Gaussian dilation, a dyadic bridge and Rayleigh bounds is retained. The weaker geometric volume-product input is obtained from a genuinely reused stronger sharp symmetric Mahler proof, with complete attribution. At the terminal bridge-to-spectrum step, an actual H0 killed-density-row competitor, free-heat approximation, logarithmic-grid energy estimates and compactness replace the classical killed-heat-kernel spectral identification. Its weaker intermediate constants still give the stated unspecified C(p)(A+n); the manuscript's sharper intermediate display is not certified by that alternative. One normalized even nonnegative log-concave weak first minimizer is constructed from Gaussian killing iterations and compactness; universal strict positivity, simplicity and all-groundstate log-concavity are not inferred. These departures preserve the three complete principal conclusions and introduce no replacement conclusion as an input hypothesis. Full arbitrary-law Borell affine-support equivalence is not claimed; the actual finite-information law-to-density theorem needed by M03 is proved."
